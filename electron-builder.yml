appId: "com.robotlog.yourtune"
productName: "YourTune"
files:
  - '!*'
  - dist
  - assets
  - license
  - '!node_modules'
  - 'node_modules/custom-electron-prompt/**'
  - 'node_modules/@ghostery/adblocker-electron-preload/**'
  - 'node_modules/@ffmpeg.wasm/core-mt/**'
  - '!node_modules/**/*.map'
  - '!node_modules/**/*.ts'
asarUnpack:
  - assets
mac:
  identity: null
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: assets/generated/icons/mac/icon.icon
  compression: maximum
win:
  icon: assets/generated/icons/win/icon.ico
  target:
    - target: nsis
      arch:
        - x64
        - arm64
    - target: portable
      arch:
        - x64
        - arm64
  compression: maximum
nsis:
  artifactName: ${productName}-Setup-${version}.${ext}
  runAfterFinish: false
portable:
  artifactName: ${productName}-${version}-portable.${ext}
linux:
  icon: assets/generated/icons/png
  category: AudioVideo
  syncDesktopName: true
  desktop:
    entry:
      StartupWMClass: "com.robotlog.yourtune"
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
    - target: rpm
      arch:
        - x64
    - target: tar.gz
      arch:
        - x64
        - arm64
appImage:
  description: "Desktop music player with custom plugins"
  category: AudioVideo
deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libasound2
    - libgbm1
rpm:
  depends:
    - libuuid
  fpm:
    - '--rpm-rpmbuild-define'
    - _build_id_links none
directories:
  output: ./pack/
