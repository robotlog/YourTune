# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
reviews:
  profile: chill
  high_level_summary: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - "!pnpm-lock.yaml"
    - "!src/i18n/resources/**"
    - "!**/*.svg"
    - "!extras/*/tests/fixtures/**"
chat:
  auto_reply: true
